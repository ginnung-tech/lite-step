<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lite-STEP Headless 6-Axis Render</title>
<style>
  html, body { margin: 0; padding: 0; background: #87a5c8; }
  #wrap { position: relative; width: 1024px; height: 1024px; }
  #cap {
    position: absolute; left: 16px; bottom: 16px;
    background: rgba(0,0,0,.63); color: #fff;
    font: bold 28px sans-serif; padding: 10px 18px;
  }
</style>
<!--
  Vendored render stack (Docker bakes the bundle into
  web_render/vendor/ at build time; worker.validator symlinks
  web_render into the per-task workdir so the page Chromium loads
  via file:// can resolve them with relative paths):

    vendor/render-app.js         — bundled three + @thatopen/components +
                                    @thatopen/fragments + web-ifc + the
                                    render logic (web_render/src/render-app.mjs).
    vendor/fragments-worker.mjs  — the fragments geometry worker.
    vendor/web-ifc/web-ifc.wasm  — web-ifc WASM for IfcImporter.

  This is the SAME ThatOpen Components stack the browser app migrated to, so
  the validator's renders match what the user sees in the viewer (same
  loader semantics, same skipped-element behaviour, comparable shading).
-->
<script>
/*
  fetch() of file:// URLs from a file:// page is BLOCKED in Chromium even
  with --allow-file-access-from-files — that flag opens XHR / same-origin DOM
  access between file:// origins, but the Fetch API explicitly refuses
  non-http(s) URLs. The render module fetches ./output.ifc, the web-ifc WASM
  (via IfcImporter), and the fragments worker source — all file:// — so we
  redirect those fetches through XHR (which IS allowed under the flag).

  This shim is installed BEFORE the module import runs (the script tag is
  plain <script>, not type="module", so it executes during parse rather than
  after import resolution). It only intercepts file:// URLs — everything else
  flows through the original fetch. Surfaced 2026-05-29 staging verify of
  #295 ("Fetch API cannot load file:// URLs"); fix in #296.
*/
(() => {
  const MIME_BY_EXT = [
    ['.wasm', 'application/wasm'],
    ['.ifc', 'application/octet-stream'],
    ['.mjs', 'text/javascript'],
    ['.js', 'text/javascript'],
    ['.json', 'application/json'],
  ];
  function contentTypeFor(url) {
    for (const [ext, ct] of MIME_BY_EXT) {
      if (url.endsWith(ext)) return ct;
    }
    return 'application/octet-stream';
  }
  const origFetch = window.fetch.bind(window);
  window.fetch = function patchedFetch(input, init) {
    const rawUrl = typeof input === 'string' ? input : (input && input.url) || '';
    let resolved;
    try {
      resolved = new URL(rawUrl, document.baseURI).href;
    } catch (_e) {
      return origFetch(input, init);
    }
    if (!resolved.startsWith('file://')) return origFetch(input, init);
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', resolved, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = () => {
        if (xhr.status === 200 || xhr.status === 0) {
          resolve(new Response(xhr.response, { status: 200, headers: { 'content-type': contentTypeFor(resolved) } }));
        } else {
          reject(new TypeError('XHR-shim fetch ' + resolved + ' returned status ' + xhr.status));
        }
      };
      xhr.onerror = () => reject(new TypeError('XHR-shim fetch ' + resolved + ' failed'));
      xhr.send();
    });
  };
})();
</script>
</head>
<body>
<div id="wrap"><canvas id="c" width="1024" height="1024"></canvas><div id="cap"></div></div>
<!--
  Bundled render module. All imports (three / @thatopen/* / web-ifc) are
  inlined by the vendor build, so no importmap is needed. Module scripts
  execute after the fetch shim above (plain <script> in <head> runs first).
-->
<script type="module" src="./vendor/render-app.js"></script>
</body>
</html>
