name = "Ginnung"
tagline = "Bridge web applications and Lite-STEP models to Blender via WebSocket and IFC (requires Bonsai)"
maintainer = "Lite-STEP Contributors"
type = "add-on"
blender_version_min = "5.0.0"
license = [
    "SPDX:MIT",
]
website = "https://github.com/ginnung-tech/lite-step"
repository = "https://github.com/ginnung-tech/lite-step"
tracker = "https://github.com/ginnung-tech/lite-step/issues"

wheels = [
    "./wheels/websockets-16.1.1-cp313-cp313-win_amd64.whl",
]

